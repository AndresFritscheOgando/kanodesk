name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # rustup on the runner reads rust-toolchain.toml and installs stable + rustfmt + clippy.
      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # Native libraries (libvpx) from vcpkg.json, cached by manifest hash.
      # Uses a fresh vcpkg clone because the runner's copy may predate our baseline.
      - name: Cache vcpkg libraries
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-windows-static-md-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg libraries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install --triplet x64-windows-static-md --disable-metrics

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  linux:
    name: fmt, clippy, test (linux, viewer + servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build tools for libvpx
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config

      # Same vcpkg.json as Windows, triplet x64-linux (static libvpx 1.13.1).
      - name: Cache vcpkg libraries
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-linux-${{ hashFiles('vcpkg.json') }}

      - name: Fetch vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: fmt, clippy, test
        run: VCPKG_ROOT="$RUNNER_TEMP/vcpkg" packaging/linux/build.sh check
