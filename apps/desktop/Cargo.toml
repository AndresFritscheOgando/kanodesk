[package]
name = "kanodesk-desktop"
description = "KanoDesk desktop app: main window, viewer, host process and connection manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kanodesk"
path = "src/main.rs"
test = false

[build-dependencies]
embed-resource.workspace = true

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
# AccessKit: the viewer's dialogs and toolbar reach screen readers.
egui-winit = { workspace = true, features = ["accesskit"] }
kanodesk-client.workspace = true
kanodesk-config.workspace = true
kanodesk-crypto.workspace = true
kanodesk-host.workspace = true
kanodesk-input.workspace = true
kanodesk-ipc.workspace = true
kanodesk-proto.workspace = true
kanodesk-rendezvous.workspace = true
kanodesk-transport.workspace = true
pollster.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true

# Linux: X11 and Wayland for the windows (eframe's glutin needs GLX/EGL), the
# clipboard and egui-wgpu's winit glue. All of them are loaded with dlopen at
# run time, so building needs no -dev packages.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }
egui-wgpu = { workspace = true, features = ["x11", "wayland"] }
egui-winit = { workspace = true, features = ["x11", "wayland", "accesskit"] }

[lints]
workspace = true
