[package]
name = "kanodesk-proto-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kanodesk-proto = { path = ".." }

# Separate workspace: fuzzing needs nightly and must not join the main build.
[workspace]
members = ["."]

[[bin]]
name = "decode_frames"
path = "fuzz_targets/decode_frames.rs"
test = false
doc = false
bench = false
